<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #123c69;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #123c69;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 18px;
            padding: 15px;
        }

        legend {
            font-weight: bold;
            padding: 0 5px;
        }

        .gender-option {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin: 8px 20px 0 0;
        }

        .gender-option input {
            width: auto;
        }

        .gender-option label {
            margin: 0;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #123c69;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d5a96;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #555;
        }

        @media (max-width: 650px) {
            main {
                margin: 15px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Registration Portal</h1>
        <p>Welcome! Please complete the form below.</p>
    </header>

    <main>
        <section aria-labelledby="form-heading">

            <h2 id="form-heading">Student Information</h2>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="student-name">Student Name:</label>
                    <input
                        type="text"
                        id="student-name"
                        name="student_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="matric-no">Matric No:</label>
                    <input
                        type="text"
                        id="matric-no"
                        name="matric_no"
                        placeholder="Enter your matric number"
                        required>
                </div>

                <div class="form-group">
                    <label for="department">Department:</label>
                    <input
                        type="text"
                        id="department"
                        name="department"
                        placeholder="Enter your department"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="e.g. 08012345678"
                        autocomplete="tel"
                        required>
                </div>

                <fieldset>
                    <legend>Gender:</legend>

                    <div class="gender-option">
                        <input
                            type="radio"
                            id="male"
                            name="gender"
                            value="Male"
                            required>
                        <label for="male">Male</label>
                    </div>

                    <div class="gender-option">
                        <input
                            type="radio"
                            id="female"
                            name="gender"
                            value="Female">
                        <label for="female">Female</label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="program">Program:</label>
                    <select id="program" name="program" required>
                        <option value="">-- Select Your Program --</option>
                        <option value="Full Time">Full Time</option>
                        <option value="Weekday">Weekday</option>
                        <option value="Weekend">Weekend</option>
                    </select>
                </div>

                <button type="submit">Submit Registration</button>

            </form>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Registration Portal</p>
    </footer>

</body>
</html>
